# nginx-Konfiguration für BAREBASTIAN
# DOMAIN wird vom Setup-Skript ersetzt. HTTPS richtet certbot automatisch ein.
server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # Große Video-Uploads erlauben (passend zu MAX_VIDEO_UPLOAD_MB)
    client_max_body_size 2100m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/files {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads direkt durchreichen, lange Videos brauchen Zeit
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
